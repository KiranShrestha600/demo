<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel KOT - Kitchen</title>
    <link rel="stylesheet" href="kitchen-style.css">
</head>
<body>
    <div class="kitchen-container">
        <header>
            <h1>🔥 KITCHEN DASHBOARD</h1>
            <div class="notifications">
                <span id="newOrdersCount">0</span> New Orders
                <div id="soundIndicator"></div>
            </div>
        </header>

        <!-- Pending Orders -->
        <div class="orders-grid">
            <div class="order-section pending">
                <h2>⏳ Pending Orders</h2>
                <div id="pendingOrders"></div>
            </div>
            
            <div class="order-section preparing">
                <h2>🔥 In Preparation</h2>
                <div id="preparingOrders"></div>
            </div>
            
            <div class="order-section ready">
                <h2>✅ Ready</h2>
                <div id="readyOrders"></div>
            </div>
        </div>

        <!-- Chat -->
        <div class="chat-section">
            <h2>💬 Counter Chat</h2>
            <div id="kitchenChat"></div>
            <div class="chat-input">
                <input type="text" id="kitchenChatMessage" placeholder="Reply to counter...">
                <button onclick="sendKitchenChat()">Send</button>
            </div>
        </div>
        <!-- ADD THIS after the ready section (line ~45) -->

<div class="order-section history">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2>📜 Order History</h2>
        <button id="clearHistoryBtn" onclick="clearHistory()" 
                style="padding: 10px 20px; background: linear-gradient(45deg, #e74c3c, #c0392b); 
                       color: white; border: none; border-radius: 25px; font-weight: bold; 
                       font-size: 14px; cursor: pointer; box-shadow: 0 4px 15px rgba(231,76,60,0.3);
                       transition: all 0.3s;">
            🗑️ Clear History
        </button>
    </div>
    <div id="historySection" style="min-height: 120px; border: 2px dashed #ecf0f1; border-radius: 15px; padding: 20px; background: #fafbfc;">
        <div style="text-align: center; color: #bdc3c7; padding: 30px; font-style: italic;">
            Complete orders will appear here automatically!<br>
            <small>History is saved forever until cleared</small>
        </div>
    </div>
</div>
